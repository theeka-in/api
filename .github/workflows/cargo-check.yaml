name: cargo check

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    check:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Install Taskfile
              uses: arduino/setup-task@v2
              with:
                  version: 3.x

            - name: Cargo check
              run: task check:offline
