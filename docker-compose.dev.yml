services:
    migrate:
        build:
            dockerfile: Dockerfile.migrate
        environment:
            - DB_HOST=${DB_HOST}
            - DB_PORT=${DB_PORT}
            - DB_USER=${DB_USER}
            - DB_PASSWORD=${DB_PASSWORD}
            - DB_NAME=${DB_NAME}
            - MIGRATE_ENV="prod"
        depends_on:
            db:
                condition: service_healthy
        volumes:
            - ./prisma/migrations:/app/migrations
            - migrate_node_modules:/app/node_modules
        develop:
            watch:
                - action: rebuild
                  path: prisma/latest-migrate.json

    introspection:
        build:
            dockerfile: Dockerfile.introspection
        environment:
            - DB_HOST=${DB_HOST}
            - DB_PORT=${DB_PORT}
            - DB_USER=${DB_USER}
            - DB_PASSWORD=${DB_PASSWORD}
            - DB_NAME=${DB_NAME}
        depends_on:
            db:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
        volumes:
            - ./src/entities:/app/src/entities
        develop:
            watch:
                - action: rebuild
                  path: prisma/migrations
    rest:
        build:
            dockerfile: Dockerfile.dev
        ports:
            - "8080:8080"
        volumes:
            - cargo_cache:/usr/local/cargo
            - target_cache:/app/target
        env_file: .env
        depends_on:
            db:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
            introspection:
                condition: service_completed_successfully
        develop:
            watch:
                - action: sync
                  path: ./src
                  target: /app/src
                - action: rebuild
                  path: .env
                  target: /app/.env
                - action: rebuild
                  path: Cargo.toml
                - action: rebuild
                  path: Cargo.lock
    db:
        image: postgres:18-alpine
        environment:
            - POSTGRES_USER=${DB_USER}
            - POSTGRES_PASSWORD=${DB_PASSWORD}
            - POSTGRES_DB=${DB_NAME}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    cargo_cache:
    target_cache:
    postgres_data:
    migrate_node_modules:
