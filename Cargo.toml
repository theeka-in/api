[package]
name = "theeka_api"
version = "0.1.0"
edition = "2024"
authors = ["4O4-wasd"]
default-run = "theeka_api"

[dependencies]
argon2 = "0.5.3"
base64 = "0.22.1"
dotenvy = "0.15.7"
poem = "3.1.12"
poem-openapi = { version = "5.1.16", features = [
    "scalar",
    "uuid",
    "chrono",
    "email",
] }
rand = "0.10.1"
serde = "1.0.228"
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = [
    "postgres",
    "runtime-tokio",
    "macros",
    "tls-none",
    "uuid",
    "chrono",
] }
tokio = { version = "1.52.2", features = ["full"] }
uuid = { version = "1.23.1", features = ["v4"] }
