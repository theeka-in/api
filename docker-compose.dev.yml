services:
    rest:
        build:
            dockerfile: Dockerfile.dev
        ports:
            - "8080:8080"
        volumes:
            - cargo_cache:/usr/local/cargo
            - target_cache:/app/target
        env_file: .env
        depends_on:
            db:
                condition: service_healthy
        develop:
            watch:
                - action: sync
                  path: ./src
                  target: /app/src
                - action: rebuild
                  path: .env
                  target: /app/.env
                - action: rebuild
                  path: Cargo.toml
                - action: rebuild
                  path: Cargo.lock
    db:
        image: postgres:18-alpine
        environment:
            - POSTGRES_USER=${DB_USER}
            - POSTGRES_PASSWORD=${DB_PASSWORD}
            - POSTGRES_DB=${DB_NAME}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    cargo_cache:
    target_cache:
    postgres_data:
