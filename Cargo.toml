[package]
name = "theeka_api"
version = "0.1.0"
edition = "2024"
authors = ["4O4-wasd"]

[dependencies]
dotenvy = "0.15.7"
poem = "3.1.12"
poem-openapi = { version = "5.1.16", features = [
    "scalar",
    "uuid",
    "chrono",
    "email",
] }
#sea-orm = { version = "1", features = [
#    "sqlx-postgres",
#    "runtime-tokio-rustls",
#    "macros",
#] }
sqlx = { version = "0.8.6", features = [
    "postgres",
    "runtime-tokio",
    "macros",
    "tls-none",
    "uuid",
    "chrono",
] }
tokio = { version = "1.52.2", features = ["full"] }
uuid = { version = "1.23.1", features = ["v4"] }
